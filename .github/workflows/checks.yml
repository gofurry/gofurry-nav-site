name: engineering-foundation

on:
  push:
    branches: [dev, main]
    paths:
      - '.go-version'
      - '.node-version'
      - 'apps/cn/**'
      - 'db/**'
      - 'tools/**'
      - 'sqlc.yaml'
      - 'AGENTS.md'
      - '.agents/**'
      - 'contracts/**'
      - 'Taskfile.yml'
      - 'docs/**'
      - 'ops/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.go-version'
      - '.node-version'
      - 'apps/cn/**'
      - 'db/**'
      - 'tools/**'
      - 'sqlc.yaml'
      - 'AGENTS.md'
      - '.agents/**'
      - 'contracts/**'
      - 'Taskfile.yml'
      - 'docs/**'
      - 'ops/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read
  pull-requests: read

env:
  GOPROXY: "https://proxy.golang.org|direct"

concurrency:
  group: engineering-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_modules: ${{ steps.detect.outputs.has_modules }}
      policy: ${{ steps.detect.outputs.policy }}
      foundation: ${{ steps.detect.outputs.foundation }}
      nav_web: ${{ steps.detect.outputs.nav_web }}
      game_integration: ${{ steps.detect.outputs.game_integration }}
      nav_integration: ${{ steps.detect.outputs.nav_integration }}
      admin_integration: ${{ steps.detect.outputs.admin_integration }}
      vulnerability: ${{ steps.detect.outputs.vulnerability }}
    steps:
      - name: Prefer the PR check when this branch has an open PR
        id: scheduling
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if count="$(gh api --method GET "repos/${GH_REPO}/pulls" -f state=open -f "head=${REPO_OWNER}:${BRANCH}" --jq '[.[] | select(.head.repo.full_name == env.GH_REPO and .head.sha == env.HEAD_SHA)] | length')"; then
            if [[ "${count}" -gt 0 ]]; then
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              echo 'The pull_request workflow validates this branch; skip duplicate push jobs.'
            fi
          else
            echo '::warning::Could not check open PRs; run the full push checks.'
          fi
      - uses: actions/checkout@v6
        if: steps.scheduling.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        if: steps.scheduling.outputs.skip != 'true'
        with:
          node-version-file: .node-version

      - name: Build dependency matrix
        id: detect
        if: steps.scheduling.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE}"
          else
            base_sha="${PUSH_BASE}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            git ls-files -z > "${RUNNER_TEMP}/changed-files"
          else
            git diff --name-only -z "${base_sha}" "${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files"
          fi
          node .github/scripts/detect-changes.mjs < "${RUNNER_TEMP}/changed-files"

  production-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_modules == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: pnpm/action-setup@v6
        if: matrix.module == 'apps/cn/admin'
        with:
          package_json_file: apps/cn/admin/react/package.json
          run_install: false
      - uses: actions/setup-node@v6
        if: matrix.module == 'apps/cn/admin'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/cn/admin/react/pnpm-lock.yaml
      - name: Validate React Admin
        if: matrix.module == 'apps/cn/admin'
        working-directory: apps/cn/admin/react
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            printf '%s\n' "${files}"
            exit 1
          fi
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Go test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  nav-web-fast:
    needs: detect-changes
    if: needs.detect-changes.outputs.nav_web == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - name: Trust this container checkout for tracked-file policy checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/cn/web/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/cn/web/pnpm-lock.yaml
      - working-directory: apps/cn/web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/cn/web
        run: pnpm run lint
      - name: Stylelint
        working-directory: apps/cn/web
        run: pnpm run stylelint
      - name: Style policy tests
        working-directory: apps/cn/web
        run: pnpm run style:policy:test
      - name: Style policy
        working-directory: apps/cn/web
        run: pnpm run style:policy
      - name: Unit tests
        working-directory: apps/cn/web
        run: pnpm run test:unit
      - name: Nuxt tests
        working-directory: apps/cn/web
        run: pnpm run test:nuxt
      - name: Typecheck
        working-directory: apps/cn/web
        run: pnpm run typecheck
      - name: Insights semantic guards
        working-directory: apps/cn/web
        run: pnpm run insights:semantics
      - name: SEO recovery contract guards
        working-directory: apps/cn/web
        run: pnpm run seo:recovery:test
      - name: Build
        working-directory: apps/cn/web
        run: pnpm run build
      - name: Browser Smoke
        id: smoke
        working-directory: apps/cn/web
        run: pnpm run test:browser:smoke --workers=1
      - name: Smoke failure artifacts
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: nav-web-smoke-failure
          overwrite: true
          path: |
            apps/cn/web/playwright-report/
            apps/cn/web/test-results/
          retention-days: 7
          if-no-files-found: warn

  # Preserve the externally expected daily frontend check name.
  nav-web:
    needs: [detect-changes, nav-web-fast]
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.nav_web == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the Fast frontend gate
        env:
          DETECT: ${{ needs.detect-changes.result }}
          FAST: ${{ needs.nav-web-fast.result }}
        run: |
          test "$DETECT" = success
          test "$FAST" = success

  repository-policy:
    needs: detect-changes
    if: needs.detect-changes.outputs.policy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Install minimum supported Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.3
      - name: Parse Taskfile and inspect release contract
        run: |
          task --list
          task --summary build build:admin
      - name: Test change selection
        run: node --test .github/scripts/detect-changes.test.mjs
      - name: Test regression group inventory
        run: node --test .github/scripts/nav-web-regression-groups.test.mjs
      - name: Tooling contract tests
        working-directory: tools
        run: go test ./check-production-policy ./check-sqlc ./check-gofmt ./internal/schema ./db-baseline
      - working-directory: tools
        run: go run ./check-production-policy

  active-vulnerability:
    needs: detect-changes
    if: needs.detect-changes.outputs.vulnerability == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Scan active Go applications
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          results=()
          for module in admin game-backend game-collector nav-backend nav-collector uptime; do
            echo "govulncheck apps/cn/${module}"
            if go tool govulncheck -C "../apps/cn/${module}" ./...; then
              results+=("${module}: PASS")
            else
              code=$?
              results+=("${module}: FAIL (exit ${code})")
              failed=1
            fi
          done
          printf '\nScan summary:\n%s\n' "${results[@]}"
          exit "$failed"

  foundation:
    needs: detect-changes
    if: needs.detect-changes.outputs.foundation == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFURRY_TEST_POSTGRES_ADMIN_URL: postgres://postgres:foundation@127.0.0.1:5432/postgres?sslmode=disable
      GOFURRY_REQUIRE_POSTGRES_MAJOR: "18"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: sqlc vet and generate
        working-directory: tools
        run: |
          go tool sqlc vet -f ../sqlc.yaml
          go tool sqlc generate -f ../sqlc.yaml
          git diff --exit-code -- \
            ../apps/cn/admin/internal/db \
            ../apps/cn/game-backend/internal/db \
            ../apps/cn/game-collector/internal/db \
            ../apps/cn/nav-backend/internal/db \
            ../apps/cn/nav-collector/internal/db
          go run ./check-sqlc
      - name: Goose fresh, adoption, drift and cleanup checks
        working-directory: tools
        run: go test ./db-baseline -run 'Test(PostgresFreshAndBaselineAdoption|ReadabilityBackfillsPreserveSchema)$' -count=1 -v

  postgres-integration:
    needs: detect-changes
    if: needs.detect-changes.outputs.game_integration == 'true' || needs.detect-changes.outputs.nav_integration == 'true' || needs.detect-changes.outputs.admin_integration == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.1-trixie
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFURRY_SHOWCASE_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Write isolated CI database configuration
        shell: bash
        run: |
          cat > /tmp/gofurry-game-collector-integration.yaml <<'YAML'
          cluster_id: 1
          server:
            memory_limit: 1
          data_base:
            db_name: gfg_integration
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          redis:
            redis_addr: 127.0.0.1:6379
          YAML
          cat > /tmp/gofurry-nav-collector-integration.yaml <<'YAML'
          cluster_id: 1
          server:
            memory_limit: 1
          data_base:
            db_name: gfn_integration
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          redis:
            redis_addr: 127.0.0.1:6379
          YAML
          cat > /tmp/gofurry-backend-integration.yaml <<'YAML'
          database:
            db_name: postgres
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          YAML
          cat > /tmp/gofurry-admin-integration.yaml <<'YAML'
          database:
            enabled: true
            db_type: postgres
            postgres:
              db_name: postgres
              db_username: postgres
              db_password: foundation
              db_host: 127.0.0.1
              db_port: "5432"
          YAML
      - name: Prepare collector integration databases
        working-directory: tools
        env:
          PGPASSWORD: foundation
        run: |
          createdb --host=127.0.0.1 --port=5432 --username=postgres gfg_integration
          createdb --host=127.0.0.1 --port=5432 --username=postgres gfn_integration
          go tool goose -dir ../db/game/migrations postgres "postgres://postgres:foundation@127.0.0.1:5432/gfg_integration?sslmode=disable" up
          go tool goose -dir ../db/nav/migrations postgres "postgres://postgres:foundation@127.0.0.1:5432/gfn_integration?sslmode=disable" up
      - name: Game Collector integration
        if: needs.detect-changes.outputs.game_integration == 'true'
        working-directory: apps/cn/game-collector
        env:
          GOFURRY_GAME_COLLECTOR_INTEGRATION_CONFIG: /tmp/gofurry-game-collector-integration.yaml
        run: |
          go test ./collector/control -run TestGameExpiredLeaseRecoveryIntegration -count=1 -v
          go test ./collector/game/v2/repository -run TestPostgresRepositorySemantics -count=1 -v
          go test ./collector/metrics -run 'TestPostgresMacMetric(Projection|BackfillAndRebuild)' -count=1 -v
          go test ./collector/changes -run 'TestGameChange(ProjectorsIntegration|CheckpointLockSerializes|EngineBackfillRebuildIntegration)|TestMacChangeBackfillAndRebuildIntegration' -count=1 -v
      - name: Game Backend integration
        if: needs.detect-changes.outputs.game_integration == 'true'
        working-directory: apps/cn/game-backend
        env:
          GOFURRY_GAME_BACKEND_INTEGRATION_CONFIG: /tmp/gofurry-backend-integration.yaml
        run: go test ./apps/game/v2/dao -run TestPostgresReadModelSemantics -count=1 -v
      - name: Nav Collector integration
        if: needs.detect-changes.outputs.nav_integration == 'true'
        working-directory: apps/cn/nav-collector
        env:
          GOFURRY_NAV_COLLECTOR_INTEGRATION_CONFIG: /tmp/gofurry-nav-collector-integration.yaml
        run: |
          go test ./collector/control -run TestNavExpiredLeaseRecoveryIntegration -count=1 -v
          go test ./collector/observation -run TestPostgresCollectorPersistenceSemantics -count=1 -v
          go test ./collector/metrics -run 'TestP23SiteCapabilityMetric(ProjectorsIntegration|BackfillAndRebuildIntegration)' -count=1 -v
          go test ./collector/changes -run 'TestNavChange(ProjectorsIntegration|EngineBackfillRebuildIntegration)|TestP23SiteCapabilityChange(ProjectorsIntegration|BackfillAndRebuildIntegration)' -count=1 -v
      - name: Nav Backend integration
        if: needs.detect-changes.outputs.nav_integration == 'true'
        working-directory: apps/cn/nav-backend
        env:
          GOFURRY_NAV_BACKEND_INTEGRATION_CONFIG: /tmp/gofurry-backend-integration.yaml
        run: go test ./apps/nav/navPage/dao -run TestPostgresNavBackendPersistenceSemantics -count=1 -v
      - name: Admin three-database integration
        if: needs.detect-changes.outputs.admin_integration == 'true'
        working-directory: apps/cn/admin
        env:
          GOFURRY_ADMIN_INTEGRATION_CONFIG: /tmp/gofurry-admin-integration.yaml
        run: go test ./internal/bootstrap -run 'TestAdmin(ThreeDatabasePersistence|IdentityAuthorizationPersistence|LegacyIdentityUpgrade|CollaborationThreeDatabase|ShowcaseThreeDatabase|GameCollectionThreeDatabase)' -count=1 -v
