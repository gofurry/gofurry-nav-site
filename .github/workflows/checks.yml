name: engineering-foundation

on:
  push:
    paths:
      - 'gofurry-admin/**'
      - 'gofurry-game-backend/**'
      - 'gofurry-game-collector/**'
      - 'gofurry-nav-backend/**'
      - 'gofurry-nav-collector/**'
      - 'gofurry-nav-web/**'
      - 'db/**'
      - 'tools/**'
      - 'sqlc.yaml'
      - 'AGENTS.md'
      - '.agents/**'
      - 'contracts/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'gofurry-admin/**'
      - 'gofurry-game-backend/**'
      - 'gofurry-game-collector/**'
      - 'gofurry-nav-backend/**'
      - 'gofurry-nav-collector/**'
      - 'gofurry-nav-web/**'
      - 'db/**'
      - 'tools/**'
      - 'sqlc.yaml'
      - 'AGENTS.md'
      - '.agents/**'
      - 'contracts/**'
      - '.github/workflows/checks.yml'

permissions:
  contents: read

concurrency:
  group: engineering-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_modules: ${{ steps.detect.outputs.has_modules }}
      policy: ${{ steps.detect.outputs.policy }}
      foundation: ${{ steps.detect.outputs.foundation }}
      nav_web: ${{ steps.detect.outputs.nav_web }}
      game_integration: ${{ steps.detect.outputs.game_integration }}
      nav_integration: ${{ steps.detect.outputs.nav_integration }}
      admin_integration: ${{ steps.detect.outputs.admin_integration }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build dependency matrix
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "${base_sha}" "${{ github.sha }}")"
          fi
          printf '%s\n' "${changed_files}"

          affected() {
            printf '%s\n' "${changed_files}" | grep -Eq "$1"
          }
          set_bool() {
            if affected "$2"; then
              echo "$1=true" >> "${GITHUB_OUTPUT}"
            else
              echo "$1=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          shared='^(sqlc\.yaml$|tools/|\.github/workflows/checks\.yml$)'
          modules='[]'
          add_module() {
            modules="$(printf '%s' "${modules}" | jq -c --arg module "$1" '. + [$module]')"
          }
          if affected "^gofurry-game-collector/|^db/game/|${shared}"; then add_module gofurry-game-collector; fi
          if affected "^gofurry-game-backend/|^db/game/|${shared}"; then add_module gofurry-game-backend; fi
          if affected "^gofurry-nav-collector/|^db/nav/|${shared}"; then add_module gofurry-nav-collector; fi
          if affected "^gofurry-nav-backend/|^db/nav/|${shared}"; then add_module gofurry-nav-backend; fi
          if affected "^gofurry-admin/|^db/(admin|game|nav)/|${shared}"; then add_module gofurry-admin; fi
          echo "modules=${modules}" >> "${GITHUB_OUTPUT}"
          if [[ "${modules}" == "[]" ]]; then
            echo "has_modules=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_modules=true" >> "${GITHUB_OUTPUT}"
          fi

          set_bool policy '^(gofurry-(admin|game-backend|game-collector|nav-backend|nav-collector)/|db/|tools/|sqlc\.yaml$|AGENTS\.md$|\.agents/|contracts/|\.github/workflows/checks\.yml$)'
          set_bool foundation '^(db/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$|gofurry-(admin|game-backend|game-collector|nav-backend|nav-collector)/internal/db/.*/queries/)'
          set_bool nav_web '^(gofurry-nav-web/|\.github/workflows/checks\.yml$)'
          set_bool game_integration '^(gofurry-(admin|game-backend|game-collector)/|db/game/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$)'
          set_bool nav_integration '^(gofurry-(admin|nav-backend|nav-collector)/|db/nav/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$)'
          set_bool admin_integration '^(gofurry-admin/|db/(admin|game|nav)/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$)'

  production-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            printf '%s\n' "${files}"
            exit 1
          fi
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Go test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - uses: actions/setup-node@v6
        if: matrix.module == 'gofurry-admin'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gofurry-admin/web/package-lock.json
      - name: Build Admin web
        if: matrix.module == 'gofurry-admin'
        working-directory: gofurry-admin/web
        run: |
          npm ci
          npm run build

  nav-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.nav_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gofurry-nav-web/package-lock.json
      - working-directory: gofurry-nav-web
        run: npm ci
      - name: Typecheck
        working-directory: gofurry-nav-web
        run: npm run typecheck
      - name: Build
        working-directory: gofurry-nav-web
        run: npm run build

  repository-policy:
    needs: detect-changes
    if: needs.detect-changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - working-directory: tools
        run: go run ./check-production-policy

  foundation:
    needs: detect-changes
    if: needs.detect-changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFURRY_TEST_POSTGRES_ADMIN_URL: postgres://postgres:foundation@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: sqlc vet and generate
        working-directory: tools
        run: |
          go tool sqlc vet -f ../sqlc.yaml
          go tool sqlc generate -f ../sqlc.yaml
          git diff --exit-code -- +            ../gofurry-admin/internal/db +            ../gofurry-game-backend/internal/db +            ../gofurry-game-collector/internal/db +            ../gofurry-nav-backend/internal/db +            ../gofurry-nav-collector/internal/db
          go run ./check-sqlc
      - name: Goose fresh, adoption, drift and cleanup checks
        working-directory: tools
        run: go test ./db-baseline -run TestPostgresFreshAndBaselineAdoption -count=1 -v

  postgres-integration:
    needs: detect-changes
    if: needs.detect-changes.outputs.game_integration == 'true' || needs.detect-changes.outputs.nav_integration == 'true' || needs.detect-changes.outputs.admin_integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Write isolated CI database configuration
        shell: bash
        run: |
          cat > /tmp/gofurry-integration.yaml <<'YAML'
          data_base:
            db_name: postgres
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          database:
            enabled: true
            db_type: postgres
            db_name: postgres
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
            postgres:
              db_name: postgres
              db_username: postgres
              db_password: foundation
              db_host: 127.0.0.1
              db_port: "5432"
          business_databases:
            nav:
              enabled: true
              db_type: postgres
              postgres:
                db_name: postgres
                db_username: postgres
                db_password: foundation
                db_host: 127.0.0.1
                db_port: "5432"
            game:
              enabled: true
              db_type: postgres
              postgres:
                db_name: postgres
                db_username: postgres
                db_password: foundation
                db_host: 127.0.0.1
                db_port: "5432"
          redis:
            enabled: false
          YAML
      - name: Game Collector integration
        if: needs.detect-changes.outputs.game_integration == 'true'
        working-directory: gofurry-game-collector
        env:
          GOFURRY_GAME_COLLECTOR_INTEGRATION_CONFIG: /tmp/gofurry-integration.yaml
        run: go test ./collector/game/v2/repository -run TestPostgresRepositorySemantics -count=1 -v
      - name: Game Backend integration
        if: needs.detect-changes.outputs.game_integration == 'true'
        working-directory: gofurry-game-backend
        env:
          GOFURRY_GAME_BACKEND_INTEGRATION_CONFIG: /tmp/gofurry-integration.yaml
        run: go test ./apps/game/v2/dao -run TestPostgresReadModelSemantics -count=1 -v
      - name: Nav Collector integration
        if: needs.detect-changes.outputs.nav_integration == 'true'
        working-directory: gofurry-nav-collector
        env:
          GOFURRY_NAV_COLLECTOR_INTEGRATION_CONFIG: /tmp/gofurry-integration.yaml
        run: go test ./collector/observation -run TestPostgresCollectorPersistenceSemantics -count=1 -v
      - name: Nav Backend integration
        if: needs.detect-changes.outputs.nav_integration == 'true'
        working-directory: gofurry-nav-backend
        env:
          GOFURRY_NAV_BACKEND_INTEGRATION_CONFIG: /tmp/gofurry-integration.yaml
        run: go test ./apps/nav/navPage/dao -run TestPostgresNavBackendPersistenceSemantics -count=1 -v
      - name: Admin three-database integration
        if: needs.detect-changes.outputs.admin_integration == 'true'
        working-directory: gofurry-admin
        env:
          GOFURRY_ADMIN_INTEGRATION_CONFIG: /tmp/gofurry-integration.yaml
        run: go test ./internal/bootstrap -run TestAdminThreeDatabasePersistence -count=1 -v
