name: engineering-foundation

on:
  push:
    paths:
      - 'apps/cn/**'
      - 'db/**'
      - 'tools/**'
      - 'sqlc.yaml'
      - 'AGENTS.md'
      - '.agents/**'
      - 'contracts/**'
      - 'build.bat'
      - 'docs/**'
      - 'ops/**'
      - '.github/workflows/checks.yml'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'apps/cn/**'
      - 'db/**'
      - 'tools/**'
      - 'sqlc.yaml'
      - 'AGENTS.md'
      - '.agents/**'
      - 'contracts/**'
      - 'build.bat'
      - 'docs/**'
      - 'ops/**'
      - '.github/workflows/checks.yml'
      - '.github/workflows/security.yml'

permissions:
  contents: read

env:
  GOPROXY: "https://proxy.golang.org|direct"

concurrency:
  group: engineering-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_modules: ${{ steps.detect.outputs.has_modules }}
      policy: ${{ steps.detect.outputs.policy }}
      foundation: ${{ steps.detect.outputs.foundation }}
      nav_web: ${{ steps.detect.outputs.nav_web }}
      game_integration: ${{ steps.detect.outputs.game_integration }}
      nav_integration: ${{ steps.detect.outputs.nav_integration }}
      admin_integration: ${{ steps.detect.outputs.admin_integration }}
      vulnerability: ${{ steps.detect.outputs.vulnerability }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build dependency matrix
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "${base_sha}" "${{ github.sha }}")"
          fi
          printf '%s\n' "${changed_files}"

          affected() {
            printf '%s\n' "${changed_files}" | grep -Eq "$1"
          }
          set_bool() {
            if affected "$2"; then
              echo "$1=true" >> "${GITHUB_OUTPUT}"
            else
              echo "$1=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          shared='^(sqlc\.yaml$|tools/|\.github/workflows/(checks|security)\.yml$)'
          modules='[]'
          add_module() {
            modules="$(printf '%s' "${modules}" | jq -c --arg module "$1" '. + [$module]')"
          }
          if affected "^apps/cn/game-collector/|^db/game/|${shared}"; then add_module apps/cn/game-collector; fi
          if affected "^apps/cn/game-backend/|^db/game/|${shared}"; then add_module apps/cn/game-backend; fi
          if affected "^apps/cn/nav-collector/|^db/nav/|${shared}"; then add_module apps/cn/nav-collector; fi
          if affected "^apps/cn/nav-backend/|^db/nav/|${shared}"; then add_module apps/cn/nav-backend; fi
          if affected "^apps/cn/admin/|^db/(admin|game|nav)/|${shared}"; then add_module apps/cn/admin; fi
          if affected "^apps/cn/uptime/|${shared}"; then add_module apps/cn/uptime; fi
          echo "modules=${modules}" >> "${GITHUB_OUTPUT}"
          if [[ "${modules}" == "[]" ]]; then
            echo "has_modules=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_modules=true" >> "${GITHUB_OUTPUT}"
          fi

          set_bool policy '^(apps/cn/(admin|game-backend|game-collector|nav-backend|nav-collector|uptime)/|db/|tools/|sqlc\.yaml$|AGENTS\.md$|\.agents/|contracts/|\.github/workflows/(checks|security)\.yml$)'
          set_bool foundation '^(db/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$|apps/cn/(admin|game-backend|game-collector|nav-backend|nav-collector)/internal/db/.*/queries/)'
          set_bool nav_web '^(apps/cn/nav-web/|\.github/workflows/checks\.yml$)'
          set_bool game_integration '^(apps/cn/(admin|game-backend|game-collector)/|db/game/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$)'
          set_bool nav_integration '^(apps/cn/(admin|nav-backend|nav-collector)/|db/nav/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$)'
          set_bool admin_integration '^(apps/cn/admin/|db/(admin|game|nav)/|tools/|sqlc\.yaml$|\.github/workflows/checks\.yml$)'
          set_bool vulnerability '^(apps/cn/(admin|game-backend|game-collector|nav-backend|nav-collector|uptime)/go\.(mod|sum)$|tools/go\.(mod|sum)$|\.github/workflows/(checks|security)\.yml$)'

  production-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-node@v6
        if: matrix.module == 'apps/cn/admin'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cn/admin/web/package-lock.json
      - name: Build Admin web
        if: matrix.module == 'apps/cn/admin'
        working-directory: apps/cn/admin/web
        run: |
          npm ci
          npm run build
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            printf '%s\n' "${files}"
            exit 1
          fi
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Go test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  nav-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.nav_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cn/nav-web/package-lock.json
      - working-directory: apps/cn/nav-web
        run: npm ci
      - name: Typecheck
        working-directory: apps/cn/nav-web
        run: npm run typecheck
      - name: Build
        working-directory: apps/cn/nav-web
        run: npm run build

  repository-policy:
    needs: detect-changes
    if: needs.detect-changes.outputs.policy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - working-directory: tools
        run: go run ./check-production-policy

  active-vulnerability:
    needs: detect-changes
    if: needs.detect-changes.outputs.vulnerability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Scan active Go applications
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          for module in admin game-backend game-collector nav-backend nav-collector uptime; do
            echo "govulncheck apps/cn/${module}"
            go tool govulncheck -C "../apps/cn/${module}" ./...
          done

  foundation:
    needs: detect-changes
    if: needs.detect-changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      GOFURRY_TEST_POSTGRES_ADMIN_URL: postgres://postgres:foundation@127.0.0.1:5432/postgres?sslmode=disable
      GOFURRY_REQUIRE_POSTGRES_MAJOR: "18"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: sqlc vet and generate
        working-directory: tools
        run: |
          go tool sqlc vet -f ../sqlc.yaml
          go tool sqlc generate -f ../sqlc.yaml
          git diff --exit-code -- \
            ../apps/cn/admin/internal/db \
            ../apps/cn/game-backend/internal/db \
            ../apps/cn/game-collector/internal/db \
            ../apps/cn/nav-backend/internal/db \
            ../apps/cn/nav-collector/internal/db
          go run ./check-sqlc
      - name: Goose fresh, adoption, drift and cleanup checks
        working-directory: tools
        run: go test ./db-baseline -run TestPostgresFreshAndBaselineAdoption -count=1 -v

  postgres-integration:
    needs: detect-changes
    if: needs.detect-changes.outputs.game_integration == 'true' || needs.detect-changes.outputs.nav_integration == 'true' || needs.detect-changes.outputs.admin_integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Write isolated CI database configuration
        shell: bash
        run: |
          cat > /tmp/gofurry-game-collector-integration.yaml <<'YAML'
          cluster_id: 1
          server:
            memory_limit: 1
          data_base:
            db_name: gfg_integration
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          redis:
            redis_addr: 127.0.0.1:6379
          YAML
          cat > /tmp/gofurry-nav-collector-integration.yaml <<'YAML'
          cluster_id: 1
          server:
            memory_limit: 1
          data_base:
            db_name: gfn_integration
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          redis:
            redis_addr: 127.0.0.1:6379
          YAML
          cat > /tmp/gofurry-backend-integration.yaml <<'YAML'
          database:
            db_name: postgres
            db_username: postgres
            db_password: foundation
            db_host: 127.0.0.1
            db_port: "5432"
          YAML
          cat > /tmp/gofurry-admin-integration.yaml <<'YAML'
          database:
            enabled: true
            db_type: postgres
            postgres:
              db_name: postgres
              db_username: postgres
              db_password: foundation
              db_host: 127.0.0.1
              db_port: "5432"
          YAML
      - name: Prepare collector integration databases
        working-directory: tools
        env:
          PGPASSWORD: foundation
        run: |
          createdb --host=127.0.0.1 --port=5432 --username=postgres gfg_integration
          createdb --host=127.0.0.1 --port=5432 --username=postgres gfn_integration
          go tool goose -dir ../db/game/migrations postgres "postgres://postgres:foundation@127.0.0.1:5432/gfg_integration?sslmode=disable" up
          go tool goose -dir ../db/nav/migrations postgres "postgres://postgres:foundation@127.0.0.1:5432/gfn_integration?sslmode=disable" up
      - name: Game Collector integration
        if: needs.detect-changes.outputs.game_integration == 'true'
        working-directory: apps/cn/game-collector
        env:
          GOFURRY_GAME_COLLECTOR_INTEGRATION_CONFIG: /tmp/gofurry-game-collector-integration.yaml
        run: |
          go test ./collector/game/v2/repository -run TestPostgresRepositorySemantics -count=1 -v
          go test ./collector/changes -run 'TestGameChange(ProjectorsIntegration|CheckpointLockSerializes|EngineBackfillRebuildIntegration)' -count=1 -v
      - name: Game Backend integration
        if: needs.detect-changes.outputs.game_integration == 'true'
        working-directory: apps/cn/game-backend
        env:
          GOFURRY_GAME_BACKEND_INTEGRATION_CONFIG: /tmp/gofurry-backend-integration.yaml
        run: go test ./apps/game/v2/dao -run TestPostgresReadModelSemantics -count=1 -v
      - name: Nav Collector integration
        if: needs.detect-changes.outputs.nav_integration == 'true'
        working-directory: apps/cn/nav-collector
        env:
          GOFURRY_NAV_COLLECTOR_INTEGRATION_CONFIG: /tmp/gofurry-nav-collector-integration.yaml
        run: |
          go test ./collector/observation -run TestPostgresCollectorPersistenceSemantics -count=1 -v
          go test ./collector/changes -run 'TestNavChange(ProjectorsIntegration|EngineBackfillRebuildIntegration)' -count=1 -v
      - name: Nav Backend integration
        if: needs.detect-changes.outputs.nav_integration == 'true'
        working-directory: apps/cn/nav-backend
        env:
          GOFURRY_NAV_BACKEND_INTEGRATION_CONFIG: /tmp/gofurry-backend-integration.yaml
        run: go test ./apps/nav/navPage/dao -run TestPostgresNavBackendPersistenceSemantics -count=1 -v
      - name: Admin three-database integration
        if: needs.detect-changes.outputs.admin_integration == 'true'
        working-directory: apps/cn/admin
        env:
          GOFURRY_ADMIN_INTEGRATION_CONFIG: /tmp/gofurry-admin-integration.yaml
        run: go test ./internal/bootstrap -run 'TestAdmin(ThreeDatabasePersistence|IdentityAuthorizationPersistence|LegacyIdentityUpgrade)' -count=1 -v
