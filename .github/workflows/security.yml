name: active-go-security

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Scan six active Go applications
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          for module in admin game-backend game-collector nav-backend nav-collector uptime; do
            echo "govulncheck apps/cn/${module}"
            go tool govulncheck -C "../apps/cn/${module}" ./...
          done
