name: active-go-security

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Scan six active Go applications
        working-directory: tools
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          results=()
          for module in admin game-backend game-collector nav-backend nav-collector uptime; do
            echo "govulncheck apps/cn/${module}"
            if go tool govulncheck -C "../apps/cn/${module}" ./...; then
              results+=("${module}: PASS")
            else
              code=$?
              results+=("${module}: FAIL (exit ${code})")
              failed=1
            fi
          done
          printf '\nScan summary:\n%s\n' "${results[@]}"
          exit "$failed"
