name: Bug report
description: Report a reproducible bug in gofurry-nav-site.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please provide a minimal reproduction and remove credentials, private data, and credential-bearing URLs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, command, request, page path, or test case that reproduces the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "release version, image tag, or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "local / staging / production, OS, browser, Go or Node version"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Nav Web
        - Nav Backend
        - Nav Collector
        - Game Backend
        - Game Collector
        - Admin
        - Uptime / Availability
        - Database / Migration
        - CI / Tooling / Ops
        - Documentation
        - Cross-service
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or errors
      description: Redact secrets, private data, headers, cookies, tokens, DSNs, and credential-bearing URLs.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed or redacted credentials, private data, and credential-bearing URLs.
          required: true
