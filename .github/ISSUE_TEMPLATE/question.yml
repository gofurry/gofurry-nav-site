name: Question
description: Ask a usage, design, database, or deployment question.
title: "question: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, private data, and credential-bearing URLs before submitting.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include sanitized commands, paths, configuration fragments, errors, or links to relevant documentation.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Nav Web
        - Nav Backend
        - Nav Collector
        - Game Backend
        - Game Collector
        - Admin
        - Uptime / Availability
        - Database / Migration
        - CI / Tooling / Ops
        - Documentation
        - Cross-service
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed or redacted credentials, private data, and credential-bearing URLs.
          required: true
