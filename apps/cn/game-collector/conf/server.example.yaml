# GoFurry Game Collector 示例配置
# 使用方式：
# 1. 复制为 conf/server.yaml（本地）或 /etc/gf-game-collector/server.yaml（生产）。
# 2. 替换数据库、Redis、代理等真实信息。
# 3. server.yaml 可能包含密码和内网地址，不要提交到 Git。

cluster_id: 1 # 集群编号；单实例保持 1 即可。

server:
  app_name: "GF-Game-Collector"
  app_version: "v1.0.0"
  models: "debug" # 当前代码读取的字段名是 models；建议保持该键名。
  memory_limit: 1

# Optional internal-only health listener. Omit this block to keep it disabled.
health:
  enabled: true
  listen_addr: "127.0.0.1:19092"

data_base:
  db_name: "gfg" # Game 主业务库。
  db_username: "postgres"
  db_password: "CHANGE_ME"
  db_host: "127.0.0.1"
  db_port: "5432"
  max_conns: 6
  min_conns: 0
  max_conn_lifetime_seconds: 1800
  max_conn_lifetime_jitter_seconds: 300
  max_conn_idle_time_seconds: 300
  health_check_period_seconds: 60
  connect_timeout_seconds: 5
  ping_timeout_seconds: 3

redis:
  redis_addr: "127.0.0.1:6379"
  redis_password: "CHANGE_ME"

log:
  log_level: "info"
  log_mode: "prod"
  log_path: "./logs/gf-game-collector.log"
  log_max_size: 100
  log_max_backups: 10
  log_max_age: 30
  log_compress: true

collector:
  proxy: "" # Steam / 外部页面采集可选代理；为空表示直连。
  game:
    collect_players_on_startup: false # 已废弃并忽略；重启不得创建采集任务，请在 Admin Collection Center 使用 Run Now。
    game_player_interval: 24 # 仅用于首次创建 anchored durable Schedule；之后以 PostgreSQL 为准。
  v2:
    steam:
      api_requests_per_5_minutes: 240 # official API 共享限流器；按 budget-burst 换算 interval，仍需遵守 developer key 每日预算。
      store_requests_per_5_minutes: 180 # Store 共享限流器；按 budget-burst 换算 interval，保守低于 appdetails 实验中的 220-230 风控边界。
      burst: 1 # 同一类接口共享限流器；interval 按 budget-burst 计算，避免初始令牌突破 5 分钟预算。
      max_workers: 3 # v2 runner worker 数；并发不等于请求速率。
      request_timeout_seconds: 10
      retry:
        max_attempts: 2
        base_delay_seconds: 5
        cooldown_on_429_seconds: 300 # 429/403/5xx/timeout 后的保守冷却窗口。
    retention:
      player_counts_days: 90 # 兼容字段；P0.1.1 暂停 player counts destructive prune。
      collect_runs_days: 90 # 兼容字段；P0.1.1 暂停 durable Job/Run prune。
      collect_task_results_days: 90 # P0.1.1 operational Task Result 建议先保留 90 天。

facts:
  reconcile_interval_seconds: 600
  finalization_grace_minutes: 30
  retention_enabled: false # destructive raw pruning remains opt-in after checkpoint commit
  retention_batch_size: 500
