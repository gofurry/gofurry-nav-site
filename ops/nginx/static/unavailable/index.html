<!doctype html>
<html lang="zh-CN" data-lang="zh" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f1e8">
  <title>GoFurry 正在维护中</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('gf-maintenance-theme');
        var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var savedLang = localStorage.getItem('gf-maintenance-lang');
        var lang = savedLang || (/^en/i.test(navigator.language || '') ? 'en' : 'zh');
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.lang = lang;
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111827' : '#f7f1e8');
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.lang = 'zh';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f1e8;
      --panel: #fffaf3;
      --text: #3d2b1f;
      --muted: rgba(91, 67, 50, 0.82);
      --accent: #79543a;
      --border: rgba(112, 82, 61, 0.18);
      --border-strong: rgba(91, 67, 50, 0.30);
      --shadow: rgba(30, 41, 59, 0.13);
      --control-bg: #f2e7d7;
      --control-hover: #eadbc6;
      --radius: clamp(76px, 16vw, 118px);
      --card-padding: clamp(30px, 6vw, 58px);
      --squircle: polygon(
        50% 0%, 64.76% 0.10%, 70.84% 0.38%, 75.44% 0.86%, 79.24% 1.53%, 82.50% 2.40%,
        85.36% 3.47%, 87.87% 4.75%, 90.09% 6.24%, 92.04% 7.96%, 93.76% 9.91%, 95.25% 12.13%,
        96.53% 14.64%, 97.60% 17.50%, 98.47% 20.76%, 99.14% 24.56%, 99.62% 29.16%, 99.90% 35.24%,
        100% 50%, 99.90% 64.76%, 99.62% 70.84%, 99.14% 75.44%, 98.47% 79.24%, 97.60% 82.50%,
        96.53% 85.36%, 95.25% 87.87%, 93.76% 90.09%, 92.04% 92.04%, 90.09% 93.76%, 87.87% 95.25%,
        85.36% 96.53%, 82.50% 97.60%, 79.24% 98.47%, 75.44% 99.14%, 70.84% 99.62%, 64.76% 99.90%,
        50% 100%, 35.24% 99.90%, 29.16% 99.62%, 24.56% 99.14%, 20.76% 98.47%, 17.50% 97.60%,
        14.64% 96.53%, 12.13% 95.25%, 9.91% 93.76%, 7.96% 92.04%, 6.24% 90.09%, 4.75% 87.87%,
        3.47% 85.36%, 2.40% 82.50%, 1.53% 79.24%, 0.86% 75.44%, 0.38% 70.84%, 0.10% 64.76%,
        0% 50%, 0.10% 35.24%, 0.38% 29.16%, 0.86% 24.56%, 1.53% 20.76%, 2.40% 17.50%,
        3.47% 14.64%, 4.75% 12.13%, 6.24% 9.91%, 7.96% 7.96%, 9.91% 6.24%, 12.13% 4.75%,
        14.64% 3.47%, 17.50% 2.40%, 20.76% 1.53%, 24.56% 0.86%, 29.16% 0.38%, 35.24% 0.10%
      );
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111827;
      --panel: #1b2535;
      --text: rgba(241, 245, 249, 0.96);
      --muted: rgba(203, 213, 225, 0.80);
      --accent: #9bc5ed;
      --border: rgba(203, 213, 225, 0.16);
      --border-strong: rgba(226, 232, 240, 0.28);
      --shadow: rgba(2, 6, 23, 0.38);
      --control-bg: #26364a;
      --control-hover: #31465e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      letter-spacing: 0.025em;
      padding: 0 18px 32px;
      transition:
        background-color 260ms ease,
        color 260ms ease;
    }

    .topbar {
      display: flex;
      position: absolute;
      z-index: 1;
      bottom: clamp(28px, 5vw, 42px);
      left: 50%;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transform: translateX(-50%);
    }

    .card-shell {
      display: grid;
      flex: 1;
      width: min(100%, 680px);
      place-items: center;
      filter: drop-shadow(0 28px 36px var(--shadow));
      transition: filter 260ms ease;
    }

    main {
      position: relative;
      display: flex;
      width: 100%;
      aspect-ratio: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      corner-shape: squircle;
      clip-path: var(--squircle);
      background: var(--panel);
      isolation: isolate;
      padding: var(--card-padding);
      text-align: center;
      transition:
        background-color 260ms ease,
        border-color 260ms ease;
    }

    .control-button {
      display: inline-flex;
      min-width: 44px;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.035em;
      line-height: 1;
      padding: 0;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        color 180ms ease;
    }

    .control-button:hover {
      color: var(--accent);
    }

    .control-button:focus-visible {
      outline: 3px solid rgba(96, 165, 250, 0.42);
      outline-offset: 3px;
    }

    .control-label {
      min-width: 36px;
      text-align: center;
    }

    .control-track {
      display: flex;
      width: 26px;
      height: 16px;
      align-items: center;
      border-radius: 999px;
      background: rgba(91, 67, 50, 0.24);
      padding: 2px;
      transition: background-color 180ms ease;
    }

    .control-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--panel);
      box-shadow: 0 1px 3px rgba(61, 43, 31, 0.18);
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .control-button[aria-checked="true"] .control-track {
      background: var(--accent);
    }

    .control-button[aria-checked="true"] .control-thumb {
      transform: translateX(10px);
    }

    html[data-theme="dark"] .control-track {
      background: rgba(203, 213, 225, 0.30);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
      text-align: center;
      transition:
        background-color 260ms ease,
        border-color 260ms ease;
    }

    .brand-logo {
      display: block;
      width: clamp(128px, 20vw, 164px);
      height: auto;
      color: var(--text);
      filter: none;
      transition: filter 260ms ease;
    }

    html[data-theme="dark"] .brand-logo {
      filter: invert(1);
    }

    .headline {
      max-width: 610px;
      margin: 0;
      color: var(--text);
      font-size: clamp(32px, 5.2vw, 52px);
      font-weight: 900;
      letter-spacing: 0.035em;
      line-height: 1.22;
      text-wrap: balance;
    }

    .lead {
      max-width: 610px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 20px);
      letter-spacing: 0.035em;
      line-height: 2;
      text-wrap: pretty;
    }

    html[data-lang="en"] .headline {
      letter-spacing: -0.02em;
    }

    html[data-lang="en"] .lead {
      letter-spacing: 0.012em;
      line-height: 1.8;
    }

    @media (max-width: 620px) {
      body {
        padding: 0 12px 18px;
      }

      .topbar {
        bottom: 24px;
        gap: 20px;
      }

      .control-button {
        min-width: 42px;
      }

      main {
        --card-padding: 24px;
        --radius: 68px;
        min-height: min(680px, calc(100vh - 104px));
        aspect-ratio: auto;
        border-radius: var(--radius);
      }

      .brand {
        margin-bottom: 30px;
      }

      .brand-logo {
        width: 132px;
      }

      .lead {
        font-size: 16px;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var copy = {
        zh: {
          title: 'GoFurry 正在维护中',
          headline: 'GoFurry正在接受维护',
          lead: '我们将很快与你再见面',
          languageButton: '中文',
          themeToDark: '深色',
          themeToLight: '浅色'
        },
        en: {
          title: 'GoFurry is under maintenance',
          headline: 'GoFurry is under maintenance',
          lead: 'We will be back with you soon.',
          languageButton: 'EN',
          themeToDark: 'Dark',
          themeToLight: 'Light'
        }
      };

      var root = document.documentElement;
      var languageButton = document.querySelector('[data-action="language"]');
      var themeButton = document.querySelector('[data-action="theme"]');
      var languageLabel = languageButton.querySelector('.control-label');
      var themeLabel = themeButton.querySelector('.control-label');
      var themeMeta = document.querySelector('meta[name="theme-color"]');

      function currentLang() {
        return root.dataset.lang === 'en' ? 'en' : 'zh';
      }

      function currentTheme() {
        return root.dataset.theme === 'dark' ? 'dark' : 'light';
      }

      function applyLang(lang) {
        var pack = copy[lang] || copy.zh;
        root.dataset.lang = lang;
        root.lang = lang === 'en' ? 'en' : 'zh-CN';
        document.title = pack.title;
        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          var key = node.getAttribute('data-i18n');
          if (key && pack[key]) {
            node.textContent = pack[key];
          }
        });
        languageLabel.textContent = pack.languageButton;
        languageButton.setAttribute('aria-checked', String(lang === 'en'));
        languageButton.setAttribute('aria-label', lang === 'en' ? 'Switch to Chinese' : '切换为英文');
        applyTheme(currentTheme(), false);
        try {
          localStorage.setItem('gf-maintenance-lang', lang);
        } catch (error) {}
      }

      function applyTheme(theme, persist) {
        var lang = currentLang();
        var pack = copy[lang] || copy.zh;
        root.dataset.theme = theme;
        themeMeta.setAttribute('content', theme === 'dark' ? '#111827' : '#f7f1e8');
        themeLabel.textContent = theme === 'dark' ? pack.themeToDark : pack.themeToLight;
        themeButton.setAttribute('aria-checked', String(theme === 'dark'));
        themeButton.setAttribute('aria-label', lang === 'en' ? 'Switch color mode' : '切换亮暗色');
        if (persist) {
          try {
            localStorage.setItem('gf-maintenance-theme', theme);
          } catch (error) {}
        }
      }

      languageButton.addEventListener('click', function () {
        applyLang(currentLang() === 'en' ? 'zh' : 'en');
      });

      themeButton.addEventListener('click', function () {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
      });

      applyLang(currentLang());
      applyTheme(currentTheme(), false);
    })();
  </script>
