version: "2"

sql:
  - engine: "postgresql"
    schema: "db/game/migrations"
    queries: "apps/cn/game-collector/internal/db/game/queries"
    gen:
      go:
        package: "gamesqlc"
        out: "apps/cn/game-collector/internal/db/game/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
